basePath: /
definitions:
  dto.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        minLength: 8
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.CommentResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  dto.CreateCommentRequest:
    properties:
      content:
        minLength: 1
        type: string
      id:
        minimum: 1
        type: integer
    required:
    - content
    - id
    type: object
  dto.CreateFeatureFlagRequest:
    properties:
      key:
        maxLength: 128
        type: string
      name:
        maxLength: 255
        type: string
      owner:
        maxLength: 255
        type: string
      purpose:
        type: string
      safeDefault:
        type: boolean
    required:
    - key
    - name
    - owner
    - purpose
    type: object
  dto.CreatePostRequest:
    properties:
      content:
        minLength: 10
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - content
    - title
    type: object
  dto.CreatePostResponse:
    properties:
      id:
        type: integer
      message:
        type: string
    type: object
  dto.EditCommentRequest:
    properties:
      content:
        minLength: 1
        type: string
    required:
    - content
    type: object
  dto.FeatureFlagArchiveRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  dto.FeatureFlagAuditListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.FeatureFlagAuditResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  dto.FeatureFlagAuditResponse:
    properties:
      actor:
        type: string
      createdAt:
        type: string
      environment:
        type: string
      field:
        type: string
      newValue:
        type: string
      previousValue:
        type: string
      reason:
        type: string
    type: object
  dto.FeatureFlagDecisionResponse:
    properties:
      enabled:
        type: boolean
      key:
        type: string
      source:
        type: string
    type: object
  dto.FeatureFlagDetailResponse:
    properties:
      createdAt:
        type: string
      key:
        type: string
      lifecycle:
        type: string
      name:
        type: string
      overrides:
        items:
          $ref: '#/definitions/dto.FeatureFlagOverrideResponse'
        type: array
      owner:
        type: string
      purpose:
        type: string
      safeDefault:
        type: boolean
      settings:
        items:
          $ref: '#/definitions/dto.FeatureFlagSettingResponse'
        type: array
      updatedAt:
        type: string
    type: object
  dto.FeatureFlagEvaluateResponse:
    properties:
      decisions:
        items:
          $ref: '#/definitions/dto.FeatureFlagDecisionResponse'
        type: array
      environment:
        type: string
    type: object
  dto.FeatureFlagListResponse:
    properties:
      flags:
        items:
          $ref: '#/definitions/dto.FeatureFlagResponse'
        type: array
    type: object
  dto.FeatureFlagOverrideResponse:
    properties:
      environment:
        type: string
      type:
        type: string
      username:
        type: string
    type: object
  dto.FeatureFlagResponse:
    properties:
      createdAt:
        type: string
      key:
        type: string
      lifecycle:
        type: string
      name:
        type: string
      owner:
        type: string
      purpose:
        type: string
      safeDefault:
        type: boolean
      updatedAt:
        type: string
    type: object
  dto.FeatureFlagSettingResponse:
    properties:
      environment:
        type: string
      mode:
        type: string
      revision:
        type: integer
      rolloutPercentage:
        type: integer
    type: object
  dto.FeedResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.PostItem'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  dto.FollowData:
    properties:
      followed_at:
        type: string
      followed_username:
        type: string
    type: object
  dto.FollowResponse:
    properties:
      data:
        $ref: '#/definitions/dto.FollowData'
      message:
        type: string
    type: object
  dto.FollowerResponse:
    properties:
      followed_at:
        type: string
      is_mutual:
        type: boolean
      name:
        type: string
      username:
        type: string
    type: object
  dto.FollowersListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.FollowerResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  dto.FollowingListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.FollowingResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  dto.FollowingResponse:
    properties:
      followed_at:
        type: string
      is_mutual:
        type: boolean
      name:
        type: string
      username:
        type: string
    type: object
  dto.LikeResponse:
    properties:
      like_count:
        type: integer
      liked:
        type: boolean
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      message:
        type: string
      username:
        type: string
    type: object
  dto.LogoutResponse:
    properties:
      message:
        type: string
    type: object
  dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  dto.NotificationResponse:
    properties:
      actor_id:
        type: integer
      actor_username:
        type: string
      body:
        type: string
      comment_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      is_read:
        type: boolean
      post_id:
        type: integer
      title:
        type: string
      type:
        type: string
      user_id:
        type: integer
    type: object
  dto.NotificationsListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.NotificationResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  dto.PostItem:
    properties:
      author:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      like_count:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.PostResponse:
    properties:
      author:
        type: string
      comments:
        items:
          $ref: '#/definitions/dto.CommentResponse'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      like_count:
        type: integer
      message:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.PostsListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.PostResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  dto.ProblemDetail:
    properties:
      code:
        type: string
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/dto.ValidationError'
        type: array
      instance:
        type: string
      request_id:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        minLength: 3
        type: string
      last_name:
        minLength: 3
        type: string
      password:
        minLength: 8
        type: string
      username:
        minLength: 3
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - username
    type: object
  dto.RegisterResponse:
    properties:
      message:
        type: string
    type: object
  dto.SearchUsersItem:
    properties:
      name:
        type: string
      username:
        type: string
    type: object
  dto.SearchUsersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.SearchUsersItem'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  dto.SetFeatureFlagEnvironmentRequest:
    properties:
      mode:
        type: string
      reason:
        type: string
      revision:
        minimum: 0
        type: integer
      rolloutPercentage:
        maximum: 100
        minimum: 0
        type: integer
    required:
    - mode
    - reason
    type: object
  dto.SetFeatureFlagOverridesRequest:
    properties:
      environment:
        type: string
      exclude:
        items:
          type: string
        type: array
      include:
        items:
          type: string
        type: array
      reason:
        type: string
    required:
    - environment
    - reason
    type: object
  dto.UnfollowResponse:
    properties:
      message:
        type: string
    type: object
  dto.UpdateFeatureFlagRequest:
    properties:
      name:
        maxLength: 255
        type: string
      owner:
        maxLength: 255
        type: string
      purpose:
        type: string
      reason:
        type: string
      safeDefault:
        type: boolean
    required:
    - name
    - owner
    - purpose
    - reason
    type: object
  dto.UpdatePostRequest:
    properties:
      content:
        type: string
      title:
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      first_name:
        maxLength: 100
        minLength: 3
        type: string
      last_name:
        maxLength: 100
        minLength: 3
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - first_name
    - last_name
    - username
    type: object
  dto.UpdateProfileResponse:
    properties:
      message:
        type: string
      username:
        type: string
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  dto.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
      reason:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the API server for the User Service.
  title: User Service API
  version: "1.0"
paths:
  /admin/feature-flags:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FeatureFlagListResponse'
      security:
      - BearerAuth: []
      summary: List feature flags
      tags:
      - feature-flags
    post:
      consumes:
      - application/json
      parameters:
      - description: Flag details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateFeatureFlagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.FeatureFlagResponse'
      security:
      - BearerAuth: []
      summary: Create feature flag
      tags:
      - feature-flags
  /admin/feature-flags/{key}:
    get:
      parameters:
      - description: Flag key
        in: path
        name: key
        required: true
        type: string
      - description: Pagination cursor from the previous response
        in: query
        name: cursor
        type: string
      - description: Items per page (1-100, default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FeatureFlagDetailResponse'
      security:
      - BearerAuth: []
      summary: Get feature flag
      tags:
      - feature-flags
    put:
      consumes:
      - application/json
      parameters:
      - description: Flag key
        in: path
        name: key
        required: true
        type: string
      - description: Flag metadata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateFeatureFlagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FeatureFlagResponse'
      security:
      - BearerAuth: []
      summary: Update feature flag metadata
      tags:
      - feature-flags
  /admin/feature-flags/{key}/archive:
    post:
      consumes:
      - application/json
      parameters:
      - description: Flag key
        in: path
        name: key
        required: true
        type: string
      - description: Archive reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.FeatureFlagArchiveRequest'
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Archive feature flag
      tags:
      - feature-flags
  /admin/feature-flags/{key}/audit:
    get:
      parameters:
      - description: Flag key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FeatureFlagAuditListResponse'
      security:
      - BearerAuth: []
      summary: List feature flag audit history
      tags:
      - feature-flags
  /admin/feature-flags/{key}/environment/{environment}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Flag key
        in: path
        name: key
        required: true
        type: string
      - description: Environment
        in: path
        name: environment
        required: true
        type: string
      - description: Availability
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SetFeatureFlagEnvironmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FeatureFlagSettingResponse'
      security:
      - BearerAuth: []
      summary: Set environment availability
      tags:
      - feature-flags
  /admin/feature-flags/{key}/overrides:
    put:
      consumes:
      - application/json
      parameters:
      - description: Flag key
        in: path
        name: key
        required: true
        type: string
      - description: Overrides
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SetFeatureFlagOverridesRequest'
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Set user overrides
      tags:
      - feature-flags
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return access and refresh tokens via HttpOnly
        cookies.
      parameters:
      - description: Login credentials
        in: body
        name: LoginRequest
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate the current user's session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LogoutResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account.
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      summary: Register
      tags:
      - auth
  /comments/{id}:
    delete:
      description: Delete an existing comment by the author.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Delete comment
      tags:
      - comments
    put:
      consumes:
      - application/json
      description: Edit an existing comment by the author.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Comment update content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.EditCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Edit comment
      tags:
      - comments
  /feature-flags/evaluate:
    get:
      parameters:
      - description: Comma-separated flag keys
        in: query
        name: keys
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FeatureFlagEvaluateResponse'
      summary: Evaluate feature flags
      tags:
      - feature-flags
  /feeds:
    get:
      description: Returns paginated posts from users the authenticated user follows
        and their own posts.
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Items per page (1-50, default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FeedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Get feed
      tags:
      - feeds
  /notifications:
    get:
      consumes:
      - application/json
      description: Retrieve notifications for the authenticated user.
      parameters:
      - description: Pagination cursor from the previous response
        in: query
        name: cursor
        type: string
      - description: Items per page (1-100, default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NotificationsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Get notifications
      tags:
      - notifications
  /notifications/{id}/read:
    put:
      description: Mark a specific notification as read.
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Mark notification as read
      tags:
      - notifications
  /notifications/read-all:
    put:
      description: Mark all notifications for the authenticated user as read.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Mark all notifications as read
      tags:
      - notifications
  /notifications/stream:
    get:
      description: Stream new notifications for the authenticated user with Server-Sent
        Events.
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream opened
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Stream notifications
      tags:
      - notifications
  /posts:
    get:
      description: Retrieve all posts for the authenticated user.
      parameters:
      - description: Pagination cursor from the previous response
        in: query
        name: cursor
        type: string
      - description: Items per page (1-100, default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PostsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Get user posts
      tags:

version: "2"
run:
  timeout: 5m
linters:
  enable:
    # --- Baseline ---
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # --- Correctness and bug detection ---
    - asasalint               # pass []any as any in func(...any)
    - asciicheck              # non-ASCII identifiers
    - bidichk                 # dangerous unicode bidi sequences (trojan source)
    - bodyclose               # unclosed http response bodies
    - canonicalheader         # non-canonical net/http header keys
    - copyloopvar             # loop var copies no longer needed (Go 1.22+)
    - dogsled                 # excessive blank identifiers
    - durationcheck           # multiplying two time.Duration values
    - errname                 # sentinel errors are Err* / error types are *Error
    - fatcontext              # contexts accumulated inside loops
    - gocheckcompilerdirectives # malformed //go: directives
    - makezero                # slices declared with non-zero length then appended
    - mirror                  # bytes<->string conversions without copies
    - nilerr                  # returning nil after checking err != nil
    - nilnesserr              # returning a different nil error than checked
    - nosprintfhostport       # Sprintf misuse when building host:port
    - prealloc                # slices that could be pre-allocated
    - predeclared             # shadowing Go's predeclared identifiers
    - reassign                # reassigning package-level variables
    - rowserrcheck            # unchecked sql.Rows.Err
    - sqlclosecheck           # unclosed sql.Rows / sql.Stmt
    - wastedassign            # assignments whose value is never used

    # --- Declaration and API hygiene ---
    - decorder                # consistent declaration order
    - gomoddirectives         # no replace/retract/exclude directives in go.mod
    - goprintffuncname        # printf-like funcs are named with a trailing f
    - musttag                 # json/yaml-marshalled structs carry field tags
    - protogetter             # prefer protobuf getters over direct field access
    - sloglint                # consistent log/slog usage

    # --- Readability and maintenance ---
    - dupword                 # duplicated words in comments and strings
    - godox                   # leftover TODO/FIXME/BUG markers
    - loggercheck             # balanced key/value pairs for log/slog
    - nakedret                # naked returns in long functions
    - nolintlint              # well-formed, explained //nolint directives
    - nonamedreturns          # named return values
    - tparallel               # inappropriate t.Parallel() usage
    - whitespace              # leading/trailing whitespace in blocks

  settings:
    govet:
      # every vet analyzer, minus the two that are known to be opinionated
      enable-all: true
      disable:
        - fieldalignment      # struct field alignment padding (noisy)
        - shadow              # variable shadowing (adopt after cleanup)
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    paths:
      - api/swagger # generated by `make docs`
      - web         # JS/TS code, not Go

formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
severity:
  default: error
  rules:
    - linters:
        - dupl
      severity: info